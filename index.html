<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Terminal 2F GIMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="spotify__app">
    
            <aside class="sidebar__left">
                <div class="library">
                    <span class="library__text">Tu biblioteca</span>

                    <div class="library__actions">
                        <button class="library__btn-create" type="button">
                            <span class="icon-plus">+</span>
                            <span>Crear</span>
                        </button>
                        <button class="library__btn-expand" type="button">
                            <span class="icon-expand">⤢</span>
                        </button>
                    </div>
                </div>    

                <div class="tags">
                    <button class="tags__category" type="button">Playlist</button>
                    <button class="tags__category" type="button">Artistas</button>
                    <button class="tags__category" type="button">Álbumes</button>
                </div>

                <div class="search">

                        <button class="search__btn-icon" type="button" arial-label="Buscardor en la biblioteca">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M21.71 20.29 18 16.61A9 9 0 1 0 16.61 18l3.68 3.68a1 1 0 0 0 1.42 0 1 1 0 0 0 0-1.39M11 18a7 7 0 1 1 7-7 7 7 0 0 1-7 7"/></svg>
                        </button>
            
                        <button class="search__btn-sort" type="button">
                            <span class="search__description">Recientes</span>
                            <svg width="22" height="22" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="5" cy="6" r="1.5" fill="currentColor"/>
                            <circle cx="5" cy="10" r="1.5" fill="currentColor"/>
                            <circle cx="5" cy="14" r="1.5" fill="currentColor"/>
                            <path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8.5 6h7m-7 4h7m-7 4h7"/>
                            </svg>
                        </button>
                </div>
                
                <ul class="media-list">
                    <li class="media-item">
                       <div class="media-item__music">
                            <div class="media-item__cover">
                                <img class="media-item__image" src="./assets/img/artista1.jpg" alt="GIMS">
                                    <div class="media-item__play">
                                       <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> 
                                    </div>
                            </div>

                            <div class="media-item__info">
                                <span class="media-item__title">GIMS</span>
                                <span class="media-item__subtitle">Artista</span>
                            </div>
                       </div> 
                    </li>

                    <li class="media-item">
                       <div class="media-item__music">
                            <div class="media-item__cover">
                                <img class="media-item__image" src="./assets/img/artista1.jpg" alt="GIMS">
                                    <div class="media-item__play">
                                       <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> 
                                    </div>
                            </div>

                            <div class="media-item__info">
                                <span class="media-item__title">GIMS</span>
                                <span class="media-item__subtitle">Artista</span>
                            </div>
                       </div> 
                    </li>
                    <li class="media-item">
                       <div class="media-item__music">
                            <div class="media-item__cover">
                                <img class="media-item__image" src="./assets/img/artista1.jpg" alt="GIMS">
                                    <div class="media-item__play">
                                       <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> 
                                    </div>
                            </div>

                            <div class="media-item__info">
                                <span class="media-item__title">GIMS</span>
                                <span class="media-item__subtitle">Artista</span>
                            </div>
                       </div> 
                    </li>
                </ul>












            </aside>

            <main class="main__content">
                
            </main>

            <aside class="sidebar__right">
                
            </aside>

            <footer class="player__bar">
                
            </footer>

    </div>
</body>
</html>
